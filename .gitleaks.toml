# gitleaks config, read by the `security` job (gitleaks-action picks it up
# from the repo root). The default rules stay on and nothing is allowlisted
# by path: a real key committed under tests/ is caught like anywhere else.
#
# The fake values that DO match a rule (test fixtures, the decoy bundle's
# bait) are skipped one by one, by fingerprint, in .gitleaksignore. A new fake
# value in a test either avoids the rule's shape or gets its own line there,
# checked by hand.

title = "bbc-ai-chatbot-admin-panel"

[extend]
useDefault = true
