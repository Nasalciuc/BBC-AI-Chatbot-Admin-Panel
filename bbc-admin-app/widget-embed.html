<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>BuyBusinessClass chat</title>
    <style>html,body{margin:0;height:100%;background:#f9fafb}</style>
  </head>
  <body>
    <!--
      PR-10: the CRM iframe and the test page load ONLY the Preact widget —
      not the whole admin panel (React, router, query client, ~1 MB) just to
      inject one script tag. /widget-embed is rewritten here in vercel.json.
      ?embedded=1 → the CRM dock: panel open, no bubble.
    -->
    <script>
      ;(function () {
        // Replaced by Vite at build. No fallback: a build without it must not
        // quietly send visitors' details to the production API (the panel
        // itself has no URL default either) — it shows why it did not load.
        var api = '%VITE_API_URL%'
        if (!api || api.charAt(0) === '%') {
          var note = document.createElement('p')
          note.textContent = 'Widget not loaded: VITE_API_URL is not set for this build.'
          document.body.appendChild(note)
          return
        }
        var s = document.createElement('script')
        s.src = '/widget/bbc-widget.js'
        s.setAttribute('data-api', api)
        if (new URLSearchParams(location.search).get('embedded') === '1') {
          s.setAttribute('data-mode', 'embedded')
        }
        s.async = true
        // A script that fails, or loads and runs no widget (no root), is said
        // on the page, as the panel's widget pages do — not a blank iframe.
        var fail = function () {
          var note = document.createElement('p')
          note.setAttribute('role', 'alert')
          note.style.cssText = 'margin:0;padding:24px;font:15px/1.5 system-ui,sans-serif;color:#555;text-align:center'
          note.textContent = 'The chat couldn\u2019t load. Reload the page to try again.'
          document.body.appendChild(note)
        }
        s.addEventListener('error', fail)
        s.addEventListener('load', function () {
          if (!document.getElementById('bbc-widget-root')) fail()
        })
        document.body.appendChild(s)
      })()
    </script>
  </body>
</html>
