# The tests that already exist, run by a machine instead of by whoever
# remembered. Nothing here deploys, nothing here needs a secret: if this file
# leaked in full it would tell an attacker only that we run pytest.
#
# Job names are short and must stay stable — `backend`, `admin`, `widget` are
# what you tick in Settings -> Branches -> required status checks. Rename one
# and the required check silently stops applying.

name: tests

on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Fake, and deliberately obvious about it. `supabase_url` / `supabase_key`
      # are the only settings with no default, so importing the app without
      # them raises before a single test runs. Nine test files rely on a local
      # .env that CI will never have — this is what replaces it.
      SUPABASE_URL: https://ci.invalid.supabase.co
      SUPABASE_KEY: ci-not-a-real-key
      ANTHROPIC_API_KEY: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # what Railway runs
          cache: pip
          cache-dependency-path: bbc-chatbot-api/requirements.txt

      - name: Install
        working-directory: bbc-chatbot-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt is the RUNTIME contract and does not carry test
          # tooling. Adding it there would ship pytest to Railway.
          pip install "pytest~=9.0" "pytest-asyncio~=1.3"

      - name: Tests
        working-directory: bbc-chatbot-api
        # `-m "not integration"` is the escape hatch for anything that ever
        # needs the network. No test carries that mark today — the whole suite
        # runs offline — and the day one does, this line already excludes it.
        run: python -m pytest -q -m "not integration"

  admin:
    name: admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bbc-admin-app/package-lock.json

      - name: Install
        working-directory: bbc-admin-app
        run: npm ci

      - name: Tests
        working-directory: bbc-admin-app
        run: npm test

      - name: Build
        working-directory: bbc-admin-app
        # `build` is `tsc -b && vite build`, so this IS the typecheck. Its
        # `prebuild` hook installs and builds bbc-widget first and copies the
        # bundle in — that is why this job is the slow one.
        run: npm run build

  widget:
    name: widget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bbc-widget/package-lock.json

      - name: Install
        working-directory: bbc-widget
        run: npm ci

      - name: Tests
        working-directory: bbc-widget
        run: npm test

      - name: Build
        working-directory: bbc-widget
        run: npm run build
