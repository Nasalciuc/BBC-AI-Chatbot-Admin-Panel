name: Process Abandoned Conversations

on:
  # 21 Aug 2026: the scheduled run is OFF. This workflow and the app's internal
  # scheduler both swept /api/cron/abandoned-crm; the internal asyncio.Lock is
  # per-process and never saw Actions, and the "job idempotency" the overlap
  # relied on was the created_in_crm flag — the exact write that was failing.
  # One client, six CRM records. The internal scheduler (same process as its
  # lock) is the single source now; workflow_dispatch stays for manual runs.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call abandoned CRM endpoint
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_API_URL }}
          CRON_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${RAILWAY_URL}/api/cron/abandoned-crm" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "::error::Cron failed with status $http_code"
            exit 1
          fi

      - name: Agent response deadline sweep
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_API_URL }}
          CRON_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${RAILWAY_URL}/api/cron/agent-response-sweep" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "::error::Agent sweep failed with status $http_code"
            exit 1
          fi
